name: loan-service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent concurrent runs on the same branch.
# If a new push arrives while CI is running, cancel the in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ─── Step 1: detect whether loan-service files changed ───────────────────────
  #
  # This job always runs and checks which files were modified.
  # The result feeds into the condition of the build-and-test job below.
  #
  # Why this approach instead of top-level `paths` filters:
  # If we used `paths` at the workflow level, GitHub would not trigger the
  # workflow at all for unrelated changes. That means no status check is
  # reported, which blocks PRs when branch protection requires this check
  # to pass. By running a detection job unconditionally, we always report
  # a result to GitHub — either "built and tested" or "no changes, skipped".
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      loan-service: ${{ steps.filter.outputs.loan-service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for relevant file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            loan-service:
              - 'src/loan-service/**'
              - 'tests/LoanService.Tests/**'
              - '.github/workflows/loan-service.yml'

  # ─── Step 2: build and test (only if relevant files changed) ─────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run if there are relevant changes, OR if this is a direct push to main
    # (not a PR). On direct pushes to main we always want to verify the build.
    if: |
      needs.detect-changes.outputs.loan-service == 'true' ||
      github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache the NuGet global packages folder.
      # Key includes the lock file hash — invalidates when dependencies change.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore LoanRecoverySystem.sln

      - name: Build
        run: dotnet build LoanRecoverySystem.sln --no-restore --configuration Release

      # Integration tests use Testcontainers — they spin up their own Docker
      # containers (SQL Server, RabbitMQ). Docker is available on ubuntu-latest.
      # The workflow itself has no knowledge of the infrastructure the tests need.
      - name: Test
        run: >
          dotnet test tests/LoanService.Tests/LoanService.Tests.csproj
          --no-build
          --configuration Release
          --logger "github;collapse-message-on-success=true"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        # Upload even if tests fail — useful for diagnosing failures.
        if: always()
        with:
          name: coverage-loan-service
          path: ./coverage
          retention-days: 7

  # ─── Step 3: required check gate ─────────────────────────────────────────────
  #
  # This job always runs and acts as the single status check that branch
  # protection requires. It succeeds if:
  #   - build-and-test ran and passed, OR
  #   - there were no relevant changes (build-and-test was skipped)
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    # Run even if build-and-test was skipped (result == 'skipped')
    if: always()
    steps:
      - name: Check result
        run: |
          echo "detect-changes result : ${{ needs.detect-changes.result }}"
          echo "build-and-test result : ${{ needs.build-and-test.result }}"

          if [[ "${{ needs.build-and-test.result }}" == "failure" || \
                "${{ needs.build-and-test.result }}" == "cancelled" ]]; then
            echo "CI failed or was cancelled."
            exit 1
          fi

          echo "CI passed (or was not required for this change set)."
